<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <meta name="author" content="ACE M. GONZALES">
  <title>Photo Gallery - Ace Gonzales</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.8;
            color: #000000;
            background: #EEFFFF;
            padding: 20px;
        }
        
        .blog-container {
            max-width: 1200px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .blog-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
            border-bottom: 5px solid white;
        }

        .greeting {
            font-size: 1.2em;
            opacity: 0.95;
            font-style: italic;
            margin-bottom: 20px;
        }
        
        .blog-header h1 {
            font-size: 3em;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            line-height: 1.3;
        }

        .highlight {
            color: #ffd700;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .blog-content {
            padding: 50px 40px;
        }

        .category-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .nav-link {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .back-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .button-container {
            text-align: center;
            margin-top: 40px;
        }
        
        @media (max-width: 768px) {
            .blog-header h1 {
                font-size: 2em;
            }
            
            .blog-content {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="blog-container">
        <div class="blog-header">
            <p class="greeting">Captured Moments</p>
            
            <h1>My <span class="highlight">Photo Gallery</span></h1>
            
            <p class="subtitle">
                A collection of memories and moments that have shaped my journey. Click any photo to view it larger!
            </p>
        </div>

        
        <div class="blog-content">
            <div class="category-nav">
                <a href="MEANDFRIENDS.html" class="nav-link">Me and My Friends</a>
                <a href="MYFAMILY.html" class="nav-link">My Family</a>
                <a href="HOBBY.html" class="nav-link">Hobbies</a>
            </div>

            <div class="button-container">
                <a href="index.html" class="back-button">← Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
