<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="ACE M. GONZALES">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Places to Visit - Ace Gonzales</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.8;
      color: #000000;
      background: #EEFFFF;
      padding: 20px;
    }

    .blog-container {
      max-width: 1200px;
      margin: 40px auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .blog-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 60px 40px;
      text-align: center;
      border-bottom: 5px solid white;
    }

    .blog-header h1 {
      font-size: 3em;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .subtitle {
      font-size: 1.1em;
      opacity: 0.95;
    }

    .blog-content {
      padding: 50px 40px;
    }

    .image-map-container {
      margin: 40px 0;
      padding: 30px;
      background: #f8f9fa;
      border-radius: 10px;
    }

    .image-map-container h2 {
      color: #667eea;
      margin-bottom: 10px;
      text-align: center;
    }

    .image-map-container p {
      text-align: center;
      margin-bottom: 20px;
      color: #666;
    }

    .map-wrapper {
      text-align: center;
    }

    .map-wrapper img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .back-button {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px 40px;
      text-decoration: none;
      border-radius: 25px;
      font-size: 1.1em;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .back-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .button-container {
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="blog-container">

    <div class="blog-header">
      <h1>Dream Places to Visit</h1>
      <p class="subtitle">5 places I want to explore someday</p>
    </div>

    <div class="blog-content">

      <div class="image-map-container">
        <h2>Image Map Shapes</h2>
        <p>Click on the shapes to explore each destination</p>

        <div class="map-wrapper">
          <img src="PICTURES/dreamplace.jpg" alt="Dream Places Map" usemap="#dreammap">
        </div>

        <map name="dreammap">
          <area shape="rect"   coords="163, 237"              href="PICTURES/paris.jpg"          alt="Paris, France"  title="Paris, France">
          <area shape="rect"   coords="220,50,370,180"        href="PICTURES/tokyo japan.jpg"    alt="Tokyo, Japan"   title="Tokyo, Japan">
          <area shape="circle" coords="495,115,75"            href="PICTURES/swissalps.jpg"      alt="Swiss Alps"     title="Swiss Alps">
          <area shape="rect"   coords="163,237,269,366"       href="PICTURES/egyp(real).jpg"   alt="Cairo, Egypt"   title="Cairo, Egypt">
          <area shape="rect"   coords="220,210,370,310"       href="PICTURES/iceland(real).jpg"  alt="Iceland"        title="Iceland">
        </map>
      </div>

      <div class="button-container">
        <a href="index.html" class="back-button">← Back to Home</a>
      </div>

    </div>
  </div>
</body>
</html>
